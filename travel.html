<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRAVEL MAP - COZY DINER🥤🍔</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="travel_style.css">
</head>
<body>

<div class="outer">
  <!-- トップのチェッカー -->
  <div class="checker-wrap">
    <div class="checker" id="checker-top"></div>
  </div>

  <div class="inner">
    <div class="header-nav">
      <a href="index.html" class="back-btn">← BACK TO MENU</a>
    </div>

    <div class="hero">
      <div class="hero-tag">WELCOME TO MY LIFE LOG</div>
      <div class="hero-top-row">
        <div class="hero-title">MY <span class="red">TRAVEL MAP</span></div>
        <img class="open-badge-img" src="images/open-badge.png" alt="OPEN 24 HOURS">
      </div>
      <div class="hero-sub">旅の記録です。基本写真とともに記録していきますが、自撮りしているなどの理由で写真がない場合があります。</div>
    </div>

    <div class="map-wrap">
      <div id="map-container"></div>
    </div>

    <div class="section-wrap">
      <div class="section-label">— SPOTS LIST —</div>
      
      <div id="spot-list" class="spot-list"></div>

      <div class="spacer"></div>
    </div>
  </div>

  <div class="footer-checker-wrap">
    <div class="footer-checker checker" id="checker-bot"></div>
  </div>
</div>

<div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <button class="modal-close-btn" onclick="closeModalDirect()">&times;</button>
    <div class="modal-spot-title" id="modal-title"></div>
    <div class="modal-image-wrap">
      <img id="modal-img" src="" alt="TRAVEL PHOTO">
    </div>
    <div id="modal-comment" class="modal-comment"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="travel_script.js"></script>
</body>
</html>
