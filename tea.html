<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEA LOG - COZY DINER🥤🍔</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tea_style.css">
</head>
<body>

<div class="outer">
  <!-- トップのチェッカー -->
  <div class="checker-wrap">
    <div class="checker" id="checker-top"></div>
  </div>

  <div class="inner">
    <!-- ヘッダー・戻るリンク -->
    <div class="header-nav">
      <a href="index.html" class="back-btn">← BACK TO MENU</a>
    </div>

    <div class="hero">
      <div class="hero-tag">WELCOME TO MY LIFE LOG</div>
      <div class="hero-top-row">
        <div class="hero-title">MY <span class="red">TEA LOG</span></div>
        <img class="open-badge-img" src="images/open-badge.png" alt="OPEN 24 HOURS">
      </div>
      <div class="hero-sub">茶葉の購入備録。主に紅茶。香りの良いお茶が好み。</div>
    </div>

    <div class="section-wrap">
      
      <div class="section-label">— BRAND SELECT —</div>
      <div class="filter-buttons">
        <button class="filter-btn active" onclick="filterCategory('ALL')">ALL</button>
        <button class="filter-btn" onclick="filterCategory('Afternoon Tea')">Afternoon Tea</button>
        <button class="filter-btn" onclick="filterCategory('AHMAD TEA')">AHMAD TEA</button>
        <button class="filter-btn" onclick="filterCategory('Anjou＆Alcyon')">Anjou＆Alcyon</button>
        <button class="filter-btn" onclick="filterCategory('AVANCE')">AVANCE</button>
        <button class="filter-btn" onclick="filterCategory('CARMIÉN')">CARMIÉN</button>
        <button class="filter-btn" onclick="filterCategory('George Steuart & Co.')">George Steuart & Co.</button>
        <button class="filter-btn" onclick="filterCategory('HAMPSTEAD TEA')">HAMPSTEAD TEA</button>
        <button class="filter-btn" onclick="filterCategory('H&F BELX')">H&F BELX</button>
        <button class="filter-btn" onclick="filterCategory('Janat')">Janat</button>
        <button class="filter-btn" onclick="filterCategory('Lipton')">Lipton</button>
        <button class="filter-btn" onclick="filterCategory('London Fruit & Herb Company')">London Fruit & Herb Company</button>
        <button class="filter-btn" onclick="filterCategory('LUPICIA')">LUPICIA</button>
        <button class="filter-btn" onclick="filterCategory('MABROC')">MABROC</button>
        <button class="filter-btn" onclick="filterCategory('Maple Terroir')">Maple Terroir</button>
        <button class="filter-btn" onclick="filterCategory('McCoy teas')">McCoy teas</button>
        <button class="filter-btn" onclick="filterCategory('MLESNA TEA')">MLESNA TEA</button>
        <button class="filter-btn" onclick="filterCategory('NEWBY')">NEWBY</button>
        <button class="filter-btn" onclick="filterCategory('Spice Up')">Spice Up</button>
        <button class="filter-btn" onclick="filterCategory('TWG TEA')">TWG TEA</button>
        <button class="filter-btn" onclick="filterCategory('TWININGS')">TWININGS</button>
        <button class="filter-btn" onclick="filterCategory('Whittard')">Whittard</button>
        <button class="filter-btn" onclick="filterCategory('えいこく屋')">えいこく屋</button>
        <button class="filter-btn" onclick="filterCategory('ひしわ')">ひしわ</button>
        <button class="filter-btn" onclick="filterCategory('株式会社チャーリー')">株式会社チャーリー</button>
        <button class="filter-btn" onclick="filterCategory('茶商 栗原園')">茶商 栗原園</button>
        <button class="filter-btn" onclick="filterCategory('日東紅茶')">日東紅茶</button>
        <button class="filter-btn" onclick="filterCategory('日本緑茶センター株式会社')">日本緑茶センター株式会社</button>
        <button class="filter-btn" onclick="filterCategory('OTHER')">OTHER</button>
      </div>

      <div class="section-label">— TEA LIST —</div>

      <div id="tea-container" class="tea-grid"></div>

      <div class="spacer"></div>
    </div>

  </div>

  <!-- フッターのチェッカーフラッグ -->
  <div class="footer-checker-wrap">
    <div class="footer-checker checker" id="checker-bot"></div>
  </div>
</div>

<script src="tea_script.js"></script>
</body>
</html>
