<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIBRARY - COZY DINER🥤🍔</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="library_style.css">
</head>
<body>

<div class="outer">
  <!-- トップのチェッカー -->
  <div class="checker-wrap">
    <div class="checker" id="checker-top"></div>
  </div>

  <div class="inner">
    <!-- ヘッダー・戻るリンク -->
    <div class="header-nav">
      <a href="index.html" class="back-btn">← BACK TO MENU</a>
    </div>

    <!-- HERO -->
    <div class="hero">
      <div class="hero-tag">WELCOME TO MY LIFE LOG</div>
      <div class="hero-top-row">
        <div class="hero-title">MY <span class="red">LIBRARY</span></div>
        <img class="open-badge-img" src="images/open-badge.png" alt="OPEN 24 HOURS">
      </div>
      <div class="hero-sub">読了本のうち、お気に入りの本を載せていきます。リンクはAmazonへ飛びます。</div>
    </div>

    <!-- SECTION WRAP -->
    <div class="section-wrap">
      <div class="section-label">— READ BOOKS —</div>

      <!-- 本棚グリッド表示領域 -->
      <div id="bookshelf" class="bookshelf-grid">
        <div class="loading-state">LOADING SHELF...</div>
      </div>

      <div class="spacer"></div>
    </div>

  </div>

  <!-- フッターのチェッカーフラッグ -->
  <div class="footer-checker-wrap">
    <div class="footer-checker checker" id="checker-bot"></div>
  </div>
</div>

<script src="script.js"></script>
<script src="library_script.js"></script>
</body>
</html>
